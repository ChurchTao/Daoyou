name: daoyou-nats-dev

services:
  nats:
    image: nats:2.11-alpine
    command:
      - --config=/etc/nats/nats-server.conf
      - --jetstream
      - --store_dir=/data/jetstream
      - --http_port=8222
      - --user=app
      - --pass=local-nats-password
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - nats-data:/data/jetstream
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz | grep -q ok']
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  nats-data:
