packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
autoInstallPeers: false
resolvePeersFromWorkspaceRoot: false
dedupePeerDependents: false
allowBuilds:
  esbuild: true
# pnpm 11+ fails installation when a dependency build is not listed. Keep the
# previous behavior: only esbuild runs its scripts.
strictDepBuilds: false
# Do not set pmOnFail. EdgeOne only ships pnpm 11, and that binary must be
# allowed to download the pinned 12.10.1 before installing. warn or ignore
# would install with pnpm 11. Local Homebrew and Cloudflare already run
# 12.10.1, so they never download. An interrupted download can leave its
# directory lock behind.

syncInjectedDepsAfterScripts:
  - build
