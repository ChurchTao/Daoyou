name: daoyou-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: daoyou-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: daoyou
      POSTGRES_PASSWORD: local-daoyou-password
      POSTGRES_DB: daoyou
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daoyou -d daoyou']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: daoyou-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', 'local-redis-password']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'local-redis-password', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11-alpine
    container_name: daoyou-nats
    restart: unless-stopped
    command:
      - --jetstream
      - --store_dir=/data/jetstream
      - --http_port=8222
      - --user=app
      - --pass=local-nats-password
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - nats-data:/data/jetstream
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz | grep -q ok']
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  nats-data:
